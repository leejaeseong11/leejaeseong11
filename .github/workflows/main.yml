name: Metrics

on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["master", "main"] }

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # LEFT: 기본 + 언어/토픽
      - name: Metrics (left)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-left.svg

          # 기본 구성
          base: header, activity, community, repositories, metadata

          # Languages
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Topics
          plugin_topics: yes
          plugin_topics_limit: 12
          plugin_topics_mode: icons

      # RIGHT: achievements(안정형) + 캘린더 + 핀 저장소
      - name: Metrics (right)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-right.svg

          base: ""

          # Achievements (안정형 프리셋)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: no
          plugin_achievements_limit: 12

          # Isocalendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Pinned repositories
          plugin_repositories: yes
          plugin_repositories_pinned: 4
